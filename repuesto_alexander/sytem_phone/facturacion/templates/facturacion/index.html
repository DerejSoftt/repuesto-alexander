{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iniciar Sesión | Super Bestia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="{% static 'image/favicon12.ico' %}" type="image/x-icon">

    <style>
        /* ══════════════════════════════════
           RESET & BASE
        ══════════════════════════════════ */
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        /* ══════════════════════════════════
           FONDO — SHOWROOM SUPER BESTIA
        ══════════════════════════════════ */
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            overflow: hidden;
            position: relative;
            background: #121212;
        }

        /* Imagen del showroom */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("{% static 'image/showroom_bg.jpg' %}");
            background-size: cover;
            background-position: center top;
            animation: slowPan 25s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes slowPan {
            0%   { transform: scale(1.0) translateX(0);     filter: brightness(0.80) saturate(1.1); }
            100% { transform: scale(1.06) translateX(-2%);  filter: brightness(0.85) saturate(1.1); }
        }

        /* Overlay oscuro para contraste */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(
                160deg,
                rgba(0, 0, 0, 0.20) 0%,
                rgba(18,0,0,0.18) 50%,
                rgba(0,0,0,0.25) 100%
            );
            z-index: 1;
        }

        /* ══════════════════════════════════
           CONTENEDOR PRINCIPAL
        ══════════════════════════════════ */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
        }

        /* ══════════════════════════════════
           TARJETA / FORMULARIO
        ══════════════════════════════════ */
        .login-card {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(16px) saturate(1.3);
            -webkit-backdrop-filter: blur(16px) saturate(1.3);
            border-radius: 12px;
            padding: 2.5rem 2.2rem 2.2rem;
            position: relative;
            overflow: hidden;
            text-align: center;
            border: 1px solid rgba(211, 47, 47, 0.25);
            box-shadow:
                0 25px 60px rgba(0,0,0,0.6),
                0 0 0 1px rgba(255,255,255,0.04) inset;
        }

        /* Línea roja superior */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, #b71c1c, #d32f2f, #e53935, #d32f2f, #b71c1c);
            background-size: 200% 100%;
            animation: slideGrad 3s linear infinite;
        }

        @keyframes slideGrad {
            0%   { background-position: 0%   0%; }
            100% { background-position: 200% 0%; }
        }

        /* ══════════════════════════════════
           LOGO
        ══════════════════════════════════ */
        .logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 1.2rem;
            margin-top: 0.4rem;
        }

        .logo-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d32f2f;
            box-shadow:
                0 0 18px rgba(211, 47, 47, 0.6),
                0 0 40px rgba(211, 47, 47, 0.2);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 18px rgba(211,47,47,0.6), 0 0 40px rgba(211,47,47,0.2); }
            50%       { box-shadow: 0 0 32px rgba(211,47,47,0.9), 0 0 70px rgba(211,47,47,0.4); }
        }

        /* ══════════════════════════════════
           TÍTULO
        ══════════════════════════════════ */
        .brand-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1.1;
            margin-bottom: 0.3rem;
        }

        .brand-title .word-super  { color: #ffffff; }
        .brand-title .word-bestia { color: #d32f2f; }

        .brand-subtitle {
            font-size: 0.78rem;
            font-weight: 300;
            color: #a0a0a0;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        /* ══════════════════════════════════
           MENSAJES DE ERROR
        ══════════════════════════════════ */
        .error-messages {
            background: rgba(211,47,47,0.12);
            border: 1px solid rgba(211,47,47,0.45);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.2rem;
            text-align: left;
        }
        .error-messages ul  { list-style: none; }
        .error-messages li  {
            color: #ef5350;
            font-size: 0.84rem;
            font-weight: 400;
        }
        .error-messages li::before { content: 'B8  '; }

        /* ══════════════════════════════════
           GRUPOS DE CAMPO
        ══════════════════════════════════ */
        .form-group {
            margin-bottom: 1.3rem;
            text-align: left;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 0.5rem;
        }

        /* Wrapper del input con borde */
        .input-wrap {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 3rem;
            background: #1e1e1e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            color: #ffffff;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.3);
            font-weight: 300;
        }

        .form-group input:focus {
            border-color: #d32f2f;
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.2),
                        0 0 15px rgba(211, 47, 47, 0.15);
        }

        /* Icono SVG dentro del input */
        .input-icon {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .input-icon svg {
            width: 17px;
            height: 17px;
            transition: color 0.3s;
        }

        .form-group:focus-within .input-icon svg {
            color: #d32f2f;
        }

        /* ══════════════════════════════════
           BOTÓN INICIAR SESIÓN
        ══════════════════════════════════ */
        .login-button {
            width: 100%;
            padding: 1rem;
            margin-top: 0.4rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #e53935 0%, #b71c1c 100%);
            box-shadow: 0 4px 18px rgba(211, 47, 47, 0.4);
            transition: transform 0.2s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        /* Efecto sheen al hover */
        .login-button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 55%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
            transition: left 0.55s ease;
        }

        .login-button:hover::before { left: 160%; }

        .login-button:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #b71c1c 0%, #e53935 100%);
            box-shadow:
                0 8px 28px rgba(211, 47, 47, 0.6),
                0 0 50px rgba(211, 47, 47, 0.2);
        }

        .login-button:active  { transform: translateY(0); }
        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* ══════════════════════════════════
           SPINNER
        ══════════════════════════════════ */
        .loading {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.85s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }

        /* ══════════════════════════════════
           FOOTER DE LA TARJETA
        ══════════════════════════════════ */
        .card-footer {
            margin-top: 1.6rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.07);
            font-size: 0.72rem;
            font-weight: 300;
            color: #a0a0a0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recover-link {
            color: #d32f2f;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.72rem;
            letter-spacing: 0.5px;
            transition: color 0.2s, text-shadow 0.2s;
        }

        .recover-link:hover {
            color: #ef5350;
            text-shadow: 0 0 10px rgba(211,47,47,0.5);
        }

        /* ══════════════════════════════════
           RESPONSIVE
        ══════════════════════════════════ */
        @media (max-width: 480px) {
            body { padding: 0.75rem; }
            .login-card { padding: 2rem 1.3rem 1.6rem; }
            .logo-icon  { width: 80px; height: 80px; }
            .brand-title { font-size: 1.65rem; }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">

            <!-- Logo -->
            <div class="logo-wrap">
                <img src="{% static 'image/logom5.jpeg' %}" alt="Logo Super Bestia" class="logo-icon">
            </div>

            <!-- Título -->
            <h1 class="brand-title">
                <span class="word-super">SUPER</span>&nbsp;<span class="word-bestia">BESTIA</span>
            </h1>
            <p class="brand-subtitle">Panel de Administración</p>

            <!-- Mensajes de error -->
            {% if messages %}
            <div class="error-messages">
                <ul>
                    {% for message in messages %}
                    <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}

            <!-- Formulario -->
            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}

                <!-- Campo Usuario -->
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#a0a0a0" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                        <input id="username" name="username" type="text"
                               placeholder="Ingresa tu usuario"
                               required autocomplete="username">
                    </div>
                </div>

                <!-- Campo Contraseña -->
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#a0a0a0" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </span>
                        <input id="password" name="password" type="password"
                               placeholder="Ingresa tu contraseña"
                               required autocomplete="current-password">
                    </div>
                </div>

                <!-- Botón -->
                <button type="submit" class="login-button" id="login-button">
                    <span id="loading-spinner" class="loading hidden"></span>
                    <span id="button-text">Iniciar Sesión</span>
                </button>
            </form>

            <!-- Footer -->
            <div class="card-footer">
                <span>&copy; 2024 Repuesto Super Bestia</span>
                <a href="#" class="recover-link">Recuperar acceso</a>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const loginForm = document.querySelector('form');
            const loginBtn  = document.getElementById('login-button');
            const btnText   = document.getElementById('button-text');
            const spinner   = document.getElementById('loading-spinner');

            loginForm.addEventListener('submit', function (e) {
                const user = document.getElementById('username').value.trim();
                const pass = document.getElementById('password').value.trim();

                if (!user || !pass) {
                    e.preventDefault();
                    alert('Por favor, completa todos los campos.');
                    return;
                }

                btnText.textContent = 'Entrando...';
                spinner.classList.remove('hidden');
                loginBtn.disabled = true;
            });
        });
    </script>
</body>
</html>
